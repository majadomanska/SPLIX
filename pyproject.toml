[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SPLIX"
version = "0.1.0"
description = "A bioinformatics pipeline for intron extraction, classification and scoring."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "PyYAML",
]

[project.scripts]
splix = "splix.pipeline:main"

[tool.setuptools]
packages = ["splix"]
